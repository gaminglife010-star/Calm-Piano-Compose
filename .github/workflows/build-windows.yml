name: Build Calm Piano Composer EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build standalone EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "CalmPianoComposer" calm_piano_composer.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: CalmPianoComposer-Windows
          path: dist/CalmPianoComposer.exe
